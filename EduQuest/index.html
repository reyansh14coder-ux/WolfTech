<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 EduQuest PRO - Level Up Your Brain</title>
  
  <!-- External CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  
  <!-- Internal CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animations.css">
  <!-- Component Styles -->
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/sidebar.css">
  <link rel="stylesheet" href="css/components/quest-board.css">
  <link rel="stylesheet" href="css/components/battle-arena.css">
  <link rel="stylesheet" href="css/components/ai-buddy.css">
  <link rel="stylesheet" href="css/components/quantum-network.css">
  <link rel="stylesheet" href="css/components/right-panel.css">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body>
  <!-- Background Effects -->
  <div class="cyber-grid"></div>
  <div class="particles" id="particles"></div>
  <div class="scan-line"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="header" id="header">
      <!-- Header content will be loaded dynamically -->
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Left Panel -->
      <aside class="left-panel" id="left-panel">
        <!-- Sidebar content will be loaded dynamically -->
      </aside>

      <!-- Center Panel -->
      <div class="center-panel" id="center-panel">
        <!-- Main content will be loaded dynamically -->
      </div>

      <!-- Right Panel -->
      <aside class="right-panel" id="right-panel">
        <!-- AI Buddy and other widgets will be loaded dynamically -->
      </aside>
    </main>

    <!-- Bottom Panels -->
    <div class="bottom-panels" id="bottom-panels">
      <!-- Bottom panels content will be loaded dynamically -->
    </div>
  </div>

  <!-- Floating Elements -->
  <div class="floating-elements">
    <div class="voice-assistant" id="voice-assistant">
      <!-- Voice assistant content will be loaded dynamically -->
    </div>
    
    <div class="music-player" id="music-player">
      <!-- Music player content will be loaded dynamically -->
    </div>
  </div>

  <!-- Notifications Container -->
  <div id="notifications"></div>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/confetti-js@0.0.18/dist/index.min.js"></script>
  
  <!-- Application Scripts -->
  <script type="module" src="js/app.js"></script>
  
  <!-- Quantum Modules -->
  <script type="module" src="js/quantum/challenges.js"></script>
  <script type="module" src="js/quantum/quests.js"></script>
  <script type="module" src="js/quantum/battle.js"></script>
  <script type="module" src="js/quantum/ai.js"></script>
  <script type="module" src="js/quantum/achievements.js"></script>
  <script type="module" src="js/quantum/skills.js"></script>
  
  <!-- Services -->
  <script type="module" src="js/services/music-player.js"></script>
  
  <!-- Utils -->
  <script type="module" src="js/utils/storage.js"></script>
  <script type="module" src="js/utils/notifications.js"></script>
  <script type="module" src="js/utils/helpers.js"></script>
</body>
</html>
